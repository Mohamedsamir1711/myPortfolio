<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F1026" />
            <stop offset="50%" stop-color="#151945" />
            <stop offset="100%" stop-color="#070814" />
        </linearGradient>

        <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4facfe" />
            <stop offset="40%" stop-color="#00f2fe" />
            <stop offset="70%" stop-color="#7f00ff" />
            <stop offset="100%" stop-color="#ff007f" />
        </linearGradient>

        <linearGradient id="text-grad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#e0e5ff" />
            <stop offset="100%" stop-color="#8ba3ff" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur1" />
            <feGaussianBlur stdDeviation="25" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <rect width="100%" height="100%" fill="url(#bg-grad)" rx="40" />

    <circle cx="250" cy="250" r="190" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" opacity="0.25" stroke-dasharray="10 15" />
    <circle cx="250" cy="250" r="220" fill="none" stroke="url(#primary-grad)" stroke-width="1" opacity="0.15" />

    <g filter="url(#glow)">
        <path d="M 120 180 C 100 250, 130 350, 250 400 C 190 360, 160 280, 170 200 Z" fill="url(#primary-grad)" opacity="0.85" />
        <path d="M 380 320 C 400 250, 370 150, 250 100 C 310 140, 340 220, 330 300 Z" fill="url(#primary-grad)" opacity="0.85" />
    </g>

    <g transform="translate(0, 0)">
        <path d="M 160 310 L 160 210 C 160 170, 190 170, 205 200 L 235 260 C 242 275, 258 275, 265 260 L 295 200 C 310 170, 340 170, 340 210 L 340 310" 
              fill="none" 
              stroke="url(#text-grad)" 
              stroke-width="24" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              filter="url(#glow)" />

        <path d="M 180 330 C 220 360, 320 360, 320 300 C 320 260, 240 270, 240 230 C 240 190, 310 190, 310 225" 
              fill="none" 
              stroke="url(#primary-grad)" 
              stroke-width="16" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              filter="url(#intense-glow)" />
    </g>

    <g transform="translate(325, 185) scale(0.7)" filter="url(#intense-glow)">
        <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z" fill="#ffffff" />
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>
    <g transform="translate(175, 315) scale(0.5)" filter="url(#intense-glow)">
        <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z" fill="#00f2fe" />
    </g>
</svg>
